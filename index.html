<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<!-- ☁️ 专属小云朵图标 -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☁️</text></svg>">
<title>小云朵 · 终极幻想版</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  
  /* 🌤️ 默认白天背景 */
  body{
    margin:0;min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    background:linear-gradient(180deg,#9cd2fe 0%,#e0f4ff 100%);
    font-family:system-ui,-apple-system,sans-serif;color:#334155;
    user-select:none;overflow:hidden;
    transition: background 1.5s ease, color 1.5s ease;
  }

  /* 🎨 换色滤镜 */
  body.theme-sunset { background: linear-gradient(180deg,#ff9a9e 0%,#fecfef 100%); }
  body.theme-sakura { background: linear-gradient(180deg,#fbc2eb 0%,#a6c1ee 100%); }
  body.theme-aurora { background: linear-gradient(180deg,#0f2027 0%,#203a43 50%,#2c5364 100%); color: #e2e8f0; }
  body.theme-aurora .track { background: rgba(255,255,255,.2); }
  body.theme-aurora .btn { background: rgba(255,255,255,.1); color: #f8fafc; border-color: rgba(255,255,255,.2); }
  body.theme-aurora #name, body.theme-aurora #lv { color: #fff; }

  /* ☔ 雨天模式 */
  body.weather-rainy { background: linear-gradient(180deg,#64748b 0%,#94a3b8 100%); color: #e2e8f0; }
  body.weather-rainy #bubble { background: rgba(30,41,59,.95); color: #f8fafc; }
  body.weather-rainy #bubble::after { border-top-color: rgba(30,41,59,.95); }

  /* 🌙 夜晚模式 */
  body.weather-night { background: linear-gradient(180deg,#1e293b 0%,#0f172a 100%); color: #e2e8f0; }
  body.weather-night #bubble { background: rgba(30,41,59,.95); color: #f8fafc; border: 1px solid rgba(255,255,255,0.1); }
  body.weather-night #bubble::after { border-top-color: rgba(30,41,59,.95); }
  body.weather-night #name, body.weather-night #lv { color: #fff; }

  .night-sky { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; transition: opacity 1.5s; z-index: 0; }
  body.weather-night .night-sky { opacity: 1; }
  .moon { position: absolute; top: 15%; right: 20%; font-size: 40px; animation: float 6s ease-in-out infinite; }
  .star { position: absolute; font-size: 12px; animation: blink 3s infinite; }

  #sky-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .cloud-bg { position: absolute; background: #fff; border-radius: 50px; opacity: 0.8; filter: blur(4px); animation: drift linear infinite; }
  .cloud-bg::before { content: ''; position: absolute; top: -25px; left: 20px; width: 60px; height: 60px; background: #fff; border-radius: 50%; }
  .cloud-bg::after { content: ''; position: absolute; top: -15px; right: 20px; width: 50px; height: 50px; background: #fff; border-radius: 50%; }
  .c1 { width: 120px; height: 40px; top: 15%; left: -200px; animation-duration: 25s; }
  .c2 { width: 180px; height: 60px; top: 35%; left: -250px; animation-duration: 35s; animation-delay: 5s; opacity: 0.6; filter: blur(6px); }
  .c3 { width: 90px; height: 30px; top: 70%; left: -150px; animation-duration: 20s; animation-delay: 12s; opacity: 0.9; }
  .c4 { width: 140px; height: 50px; top: 85%; left: -200px; animation-duration: 40s; animation-delay: 2s; opacity: 0.5; filter: blur(5px); }
  @keyframes drift { 0% { transform: translateX(0) translateY(0); } 50% { transform: translateX(50vw) translateY(-10px); } 100% { transform: translateX(120vw) translateY(0); } }

  /* 放空/呼吸模式遮罩 */
  #breath-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.5s; z-index: 200;
  }
  #breath-overlay.show { opacity: 1; pointer-events: auto; }
  #breath-circle {
    width: 120px; height: 120px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #a5b4fc);
    box-shadow: 0 0 40px rgba(165, 180, 252, 0.6);
    transform: scale(1); transition: transform 4s ease-in-out;
  }
  #breath-text { color: #fff; font-size: 20px; margin-top: 30px; letter-spacing: 2px; }
  #breath-close { margin-top: 40px; padding: 10px 24px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.3); background: transparent; color: #fff; font-size: 14px; cursor: pointer; }

  #name, #lv, #stage, #bars, #actions { position: relative; z-index: 1; }
  #name{font-size:14px;opacity:.75;letter-spacing:2px}
  #lv{font-size:12px;opacity:.55;margin-top:4px}

  #stage{position:relative;height:280px;width:100%;display:flex;align-items:center;justify-content:center;margin:10px 0}
  
  /* 拖拽容器 */
  #cloud-wrapper { 
    display: flex; align-items: center; justify-content: center; 
    width: 150px; height: 90px; transform: scale(1.3); transform-origin: center center;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  #cloud-wrapper.dragging { transition: none; cursor: grabbing; }
  
  #cloud{ position:relative;width:150px;height:90px; animation:float 4s ease-in-out infinite; transition:filter .4s; cursor:pointer; transform-origin: center bottom; }
  @keyframes float{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
  
  @keyframes cloudBounce { 0% { transform: translateY(0) scale(1); } 30% { transform: translateY(10px) scale(1.1, 0.9); } 60% { transform: translateY(-5px) scale(0.95, 1.05); } 100% { transform: translateY(0) scale(1); } }
  #cloud.bounce { animation: cloudBounce 0.5s ease-out; }
  
  @keyframes crazyShake { 0% { transform: translateX(0) rotate(0deg); } 25% { transform: translateX(-4px) rotate(-3deg); } 50% { transform: translateX(4px) rotate(3deg); } 75% { transform: translateX(-4px) rotate(-3deg); } 100% { transform: translateX(0) rotate(0deg); } }
  #cloud.crazy { animation: crazyShake 0.3s ease-in-out infinite; }

  @keyframes flip { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }
  #cloud.flip { animation: flip 0.8s ease-in-out; }

  /* ☁️ 立体云朵材质 */
  .puff{ position:absolute; border-radius:50%; background: radial-gradient(circle at 35% 30%, #ffffff 0%, #f4f9fd 60%, #e2effa 100%); box-shadow: 0 10px 20px rgba(0,0,0,0.08), inset 0 -6px 12px rgba(148, 163, 184, 0.15), inset 0 6px 10px rgba(255, 255, 255, 1); border: 1px solid rgba(255,255,255,0.8); transition:background .4s; }
  .p1{width:90px;height:90px;left:30px;top:0}
  .p2{width:66px;height:66px;left:0;top:24px}
  .p3{width:74px;height:74px;right:0;top:18px}
  .p4{width:110px;height:56px;left:20px;bottom:0;border-radius:40px}

  #accessory { position: absolute; top: -35px; left: 50%; transform: translateX(-50%); font-size: 24px; opacity: 0; transition: opacity 0.5s, top 0.5s; z-index: 3; }
  #accessory.show { opacity: 1; top: -45px; }

  .eye{position:absolute;width:12px;height:14px;background:#334155;border-radius:50%;top:44px;animation:blink 5s infinite; z-index: 2;}
  .eye.l{left:52px} .eye.r{right:52px}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  
  .blush{position:absolute;width:18px;height:10px;border-radius:50%;background:#fda4af;opacity:.7;top:62px;transition:all .4s; z-index: 2;}
  .blush.l{left:36px} .blush.r{right:36px}
  
  .mouth{position:absolute;width:16px;height:8px;left:50%;top:68px;transform:translateX(-50%);border-bottom:3px solid #334155;border-radius:0 0 16px 16px;transition:all .3s; z-index: 2;}
  @keyframes talkAnim { 0%, 100% { transform: translateX(-50%) scaleY(1); } 50% { transform: translateX(-50%) scaleY(0.6); } }
  #cloud.talking .mouth { animation: talkAnim 0.6s ease-in-out infinite; }

  #cloud.sleeping .eye { height: 8px !important; width: 14px !important; background: transparent !important; border-bottom: 3px solid #334155 !important; border-radius: 0 0 14px 14px !important; top: 45px !important; animation: none !important; transform: none !important; }
  #cloud.sleeping .mouth { width: 10px; height: 10px; border-radius: 50%; border-bottom: 2px solid #334155; top: 66px; }
  #cloud.sleeping .blush { opacity: 0.4; }
  
  @keyframes wakeUp { 0% { transform: scaleY(0.1); } 50% { transform: scaleY(1.2); } 100% { transform: scaleY(1); } }
  #cloud.awake .eye { animation: wakeUp 0.6s ease-out; }

  #cloud.shy .eye { animation: none; transform: scaleY(0.6) translateY(5px); }
  #cloud.shy .blush { opacity: 1; background: #fb7185; transform: scale(1.3); }

  @keyframes lookAround { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  #cloud.looking .eye { animation: lookAround 2s ease-in-out infinite; }
  #cloud.looking .eye.l { left: 48px; } #cloud.looking .eye.r { right: 48px; }

  .zzz { position: absolute; top: -10px; right: 20px; font-size: 14px; font-weight: bold; color: #64748b; opacity: 0; pointer-events: none; animation: floatZ 2s infinite ease-in-out; z-index: 2; }
  @keyframes floatZ { 0% { opacity: 0; transform: translateY(0) scale(0.8); } 50% { opacity: 1; transform: translateY(-20px) scale(1.1); } 100% { opacity: 0; transform: translateY(-40px) scale(0.8); } }
  #cloud.sleeping .zzz { opacity: 1; }

  .falling-star { position: absolute; font-size: 24px; pointer-events: auto; cursor: pointer; user-select: none; z-index: 5; animation: starFall linear forwards; }
  @keyframes starFall { 0% { transform: translateY(-50px) rotate(0deg); } 100% { transform: translateY(300px) rotate(360deg); opacity: 0; } }

  #bubble{ position:absolute;top:6px;left:50%;transform:translateX(-50%); background:rgba(255,255,255,.95);color:#334155; padding:10px 16px;border-radius:16px;font-size:14px;line-height:1.5; max-width:260px;text-align:center;opacity:0;transition:opacity .35s; box-shadow:0 8px 24px rgba(0,0,0,.1); z-index: 10; }
  #bubble.show{opacity:1}
  #bubble::after{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top-color:rgba(255,255,255,.95);border-bottom:none}

  #bars{display:flex;gap:18px;margin:8px 0 4px;font-size:12px;opacity:.8}
  .bar{text-align:center}
  .track{width:70px;height:6px;background:rgba(0,0,0,.08);border-radius:99px;overflow:hidden;margin-top:5px}
  .fill{height:100%;border-radius:99px;transition:width .5s}
  #moodFill{background:linear-gradient(90deg,#f472b6,#fb7185)}
  #energyFill{background:linear-gradient(90deg,#38bdf8,#22d3ee)}
  #loveFill{background:linear-gradient(90deg,#facc15,#fb923c)}

  /* 🎈 按钮区域（重新排版，让 9 个按钮更整齐） */
  #actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:15px;padding:0 15px;max-width:400px;}
  .btn{ padding:10px 14px;border-radius:999px;border:1px solid rgba(0,0,0,.1); background:rgba(255,255,255,.7);color:#334155;font-size:13px;cursor:pointer; transition:.2s;box-shadow: 0 4px 12px rgba(0,0,0,.05); backdrop-filter: blur(4px); }
  .btn:active{transform:scale(.94);background:rgba(255,255,255,.95)}

  .heart{position:absolute;font-size:18px;pointer-events:none;animation:rise 1.2s ease-out forwards}
  @keyframes rise{ 0%{opacity:1;transform:translateY(0) scale(.6)} 100%{opacity:0;transform:translateY(-90px) scale(1.3)} }

  /* 弹窗通用 */
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.2); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 100; }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal-content { background: rgba(255,255,255,0.95); border-radius: 24px; padding: 24px; width: 85%; max-width: 320px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); text-align: center; border: 1px solid rgba(255,255,255,0.8); transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  .modal-overlay.show .modal-content { transform: scale(1); }
  .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #334155; }
  #talk-input, #name-input { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid rgba(0,0,0,0.1); background: rgba(255,255,255,0.8); font-size: 14px; color: #334155; outline: none; transition: border 0.2s, background 0.2s; box-sizing: border-box; }
  #talk-input:focus, #name-input:focus { border-color: #93c5fd; background: #fff; box-shadow: 0 0 0 4px rgba(147,197,253,0.2); }
  .modal-buttons { display: flex; gap: 12px; margin-top: 20px; }
  .modal-btn { flex: 1; padding: 12px; border-radius: 14px; font-size: 14px; border: none; cursor: pointer; font-weight: 600; transition: transform 0.1s, background 0.2s; }
  .modal-btn:active { transform: scale(0.96); }
  .modal-btn.cancel { background: #f1f5f9; color: #64748b; }
  .modal-btn.cancel:hover { background: #e2e8f0; }
  .modal-btn.confirm { background: #60a5fa; color: #fff; box-shadow: 0 4px 12px rgba(96,165,250,0.4); }
  .modal-btn.confirm:hover { background: #3b82f6; }
  
  .diary-options { display: flex; justify-content: space-around; margin-top: 20px; }
  .diary-opt { font-size: 30px; cursor: pointer; transition: transform 0.2s; }
  .diary-opt:active { transform: scale(1.3); }
</style>
</head>
<body>

  <div id="sky-bg">
    <div class="cloud-bg c1"></div>
    <div class="cloud-bg c2"></div>
    <div class="cloud-bg c3"></div>
    <div class="cloud-bg c4"></div>
    <div id="rain-container"></div>
  </div>

  <div class="night-sky">
    <div class="moon">🌙</div>
    <div class="star" style="top: 20%; left: 15%;">✨</div>
    <div class="star" style="top: 30%; left: 35%; animation-delay: 1s;">⭐</div>
    <div class="star" style="top: 10%; left: 60%; animation-delay: 2s;">✨</div>
    <div class="star" style="top: 40%; left: 80%; animation-delay: 0.5s;">⭐</div>
    <div class="star" style="top: 70%; left: 25%; animation-delay: 1.5s;">✨</div>
  </div>

  <div id="name">小 云 朵</div>
  <div id="lv">Lv.1 · 刚认识</div>

  <div id="stage">
    <div id="bubble"></div>
    <div id="cloud-wrapper">
      <div id="cloud">
        <div id="accessory"></div>
        <div class="puff p1"></div>
        <div class="puff p2"></div>
        <div class="puff p3"></div>
        <div class="puff p4"></div>
        <div class="eye l"></div>
        <div class="eye r"></div>
        <div class="blush l"></div>
        <div class="blush r"></div>
        <div class="mouth"></div>
        <div class="zzz">Zzz</div>
      </div>
    </div>
  </div>

  <div id="bars">
    <div class="bar">心情<div class="track"><div class="fill" id="moodFill"></div></div></div>
    <div class="bar">能量<div class="track"><div class="fill" id="energyFill"></div></div></div>
    <div class="bar">亲密<div class="track"><div class="fill" id="loveFill"></div></div></div>
  </div>

  <div id="actions">
    <button class="btn" onclick="pet()">摸摸</button>
    <button class="btn" onclick="feed()">喂云</button>
    <button class="btn" onclick="talk()">说话</button>
    <button class="btn" onclick="getFortune()">今日运势 🔮</button> <!-- 运势回来啦！ -->
    <button class="btn" onclick="startBreath()">放空 🧘</button>
    <button class="btn" onclick="openDiary()">日记 📝</button>
    <button class="btn" onclick="startStarGame()">接星星 🌟</button>
    <button class="btn" onclick="changeTheme()">换肤 🎨</button>
    <button class="btn" onclick="openNameModal()">改名 🏷️</button>
  </div>

  <div id="talk-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-title">想对小云朵说什么？</div>
      <input type="text" id="talk-input" placeholder="例如：早安、下雨了、晚安..." maxlength="50" autocomplete="off">
      <div class="modal-buttons">
        <button class="modal-btn cancel" onclick="closeTalkModal()">取消</button>
        <button class="modal-btn confirm" onclick="submitTalk()">发送</button>
      </div>
    </div>
  </div>

  <div id="diary-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-title">今天心情怎么样呀？</div>
      <div class="diary-options">
        <div class="diary-opt" onclick="submitDiary('happy')">😊<br><span style="font-size:12px">开心</span></div>
        <div class="diary-opt" onclick="submitDiary('tired')">😫<br><span style="font-size:12px">好累</span></div>
        <div class="diary-opt" onclick="submitDiary('sad')">😢<br><span style="font-size:12px">委屈</span></div>
        <div class="diary-opt" onclick="submitDiary('angry')">😤<br><span style="font-size:12px">生气</span></div>
      </div>
      <div class="modal-buttons" style="margin-top:20px;">
        <button class="modal-btn cancel" onclick="closeDiary()">下次再说</button>
      </div>
    </div>
  </div>

  <div id="name-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-title">给小云朵起个名字吧</div>
      <input type="text" id="name-input" placeholder="请输入新名字..." maxlength="10" autocomplete="off">
      <div class="modal-buttons">
        <button class="modal-btn cancel" onclick="closeNameModal()">取消</button>
        <button class="modal-btn confirm" onclick="submitName()">确定</button>
      </div>
    </div>
  </div>

  <div id="breath-overlay">
    <div id="breath-circle"></div>
    <div id="breath-text">准备吸气……</div>
    <button id="breath-close" onclick="stopBreath()">结束放空</button>
  </div>

<script>
/* ================================================================
   ★★★ 小云朵 · 终极幻想版（运势回归！）★★★
   ================================================================ */

const KEY = 'xiaoyunduo';
let s = load();
let isManualSleep = false;
let customName = localStorage.getItem('xiaoyunduo_name') || '小云朵';
let currentTheme = localStorage.getItem('xiaoyunduo_theme') || 'default';

function load(){
  const raw = localStorage.getItem(KEY);
  const base = { mood:80, energy:80, love:0, lv:1, last:Date.now() };
  if(!raw) return base;
  const d = JSON.parse(raw);
  const hours = (Date.now() - d.last) / 3600000;
  d.mood   = Math.max(20, d.mood   - Math.floor(hours * 3));
  d.energy = Math.max(20, d.energy - Math.floor(hours * 2));
  return d;
}
function save(){ s.last = Date.now(); localStorage.setItem(KEY, JSON.stringify(s)); }

const cloud  = document.getElementById('cloud');
const wrapper = document.getElementById('cloud-wrapper');
const bubble = document.getElementById('bubble');

/* ============ 🔊 声音合成引擎 ============ */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, type = 'sine', duration = 0.1, volume = 0.1, delay = 0) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
  gain.gain.setValueAtTime(volume, audioCtx.currentTime + delay);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(audioCtx.currentTime + delay); osc.stop(audioCtx.currentTime + delay + duration);
}
const sfx = {
  pet: () => { playTone(600, 'sine', 0.1, 0.15); playTone(800, 'sine', 0.1, 0.1, 0.05); },
  feed: () => { playTone(523.25, 'triangle', 0.1, 0.15); playTone(659.25, 'triangle', 0.15, 0.15, 0.1); },
  talk: () => { playTone(400, 'sine', 0.08, 0.1); playTone(500, 'sine', 0.08, 0.1, 0.08); playTone(600, 'sine', 0.08, 0.1, 0.16); },
  magic: () => { [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => playTone(f, 'sine', 0.4, 0.1, i * 0.1)); }
};

/* ============ 🎵 白噪音 ============ */
let rainAudio = null;
function startRainSound() {
  if (!audioCtx || rainAudio) return;
  const bufferSize = 2 * audioCtx.sampleRate;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer; noise.loop = true;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.value = 800;
  const gain = audioCtx.createGain(); gain.gain.value = 0.05;
  noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  noise.start();
  rainAudio = { noise, gain };
}
function stopRainSound() { if (rainAudio) { rainAudio.noise.stop(); rainAudio = null; } }

/* ============ 🌤️ 天气与主题系统 ============ */
function setWeather(weather) {
  const body = document.body;
  const rainContainer = document.getElementById('rain-container');
  body.classList.remove('weather-rainy', 'weather-night');

  if (weather === 'rainy') {
    body.classList.add('weather-rainy'); startRainSound();
    if (rainContainer.children.length === 0) {
      for (let i = 0; i < 40; i++) {
        const drop = document.createElement('div'); drop.className = 'raindrop'; 
        drop.style.left = Math.random() * 100 + 'vw'; drop.style.animationDuration = (0.5 + Math.random() * 0.5) + 's';
        drop.style.animationDelay = (Math.random() * 2) + 's'; rainContainer.appendChild(drop);
      }
    }
  } else {
    stopRainSound(); rainContainer.innerHTML = '';
    if (weather === 'night') body.classList.add('weather-night');
  }
  updateAccessory();
}

function changeTheme() {
  const themes = ['default', 'theme-sunset', 'theme-sakura', 'theme-aurora'];
  let idx = themes.indexOf(currentTheme);
  idx = (idx + 1) % themes.length;
  currentTheme = themes[idx];
  document.body.className = document.body.className.replace(/theme-\w+/g, '').trim();
  if (currentTheme !== 'default') document.body.classList.add(currentTheme);
  localStorage.setItem('xiaoyunduo_theme', currentTheme);

}

function updateAccessory() {
  const acc = document.getElementById('accessory');
  acc.classList.remove('show');
  setTimeout(() => {
    if (document.body.classList.contains('weather-rainy')) { acc.textContent = '🍃'; } 
    else if (s.love >= 50) { acc.textContent = '👑'; } 
    else if (s.love >= 20) { acc.textContent = '🎀'; }

/* ============ 渲染与小动作 ============ */
function render(){
  document.getElementById('moodFill').style.width   = s.mood + '%';
  document.getElementById('energyFill').style.width = s.energy + '%';
  document.getElementById('loveFill').style.width   = Math.min(100, s.love % 100) + '%';
  document.getElementById('name').textContent = customName;

  const titles = ['刚认识','有点熟','好朋友','很黏你','离不开你','心意相通','命中注定','灵魂伴侣','永恒羁绊'];
  const lv = Math.min(titles.length, Math.floor(s.love / 20) + 1);
  document.getElementById('lv').textContent = `Lv.${lv} · ${titles[lv-1]}`;

    else if (s.energy >= 30) { cloud.classList.remove('sleeping'); }

/* ============ 👆 连击与拖拽 ============ */
let clickCount = 0, clickTimer = null;
let isDragging = false, startX, startY, currentX = 0, currentY = 0;

function handleCloudClick() {
  initAudio(); 
  if (cloud.classList.contains('sleeping')) { pet(); return; }
  pet(); 
  clickCount++;
  clearTimeout(clickTimer);
  clickTimer = setTimeout(() => { clickCount = 0; }, 1500); 

  if (clickCount >= 5) {
    if (!cloud.classList.contains('crazy')) {
      cloud.classList.add('crazy'); sfx.magic(); popHearts(10, '💖'); popHearts(5, '⭐');
      say('哇啊啊啊——好痒呀！！！');
      setTimeout(() => { cloud.classList.remove('crazy'); say('呼……刚才好疯狂，头晕晕的～'); }, 2000);
    }
    clickCount = 0;
  }
}

wrapper.addEventListener('mousedown', startDrag);
wrapper.addEventListener('touchstart', startDrag, {passive: false});
document.addEventListener('mousemove', drag);
document.addEventListener('touchmove', drag, {passive: false});
document.addEventListener('mouseup', endDrag);
document.addEventListener('touchend', endDrag);

function startDrag(e) {
  if (cloud.classList.contains('sleeping')) return;
  isDragging = true; wrapper.classList.add('dragging');
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  startX = clientX - currentX; startY = clientY - currentY; e.preventDefault();
}
function drag(e) {
  if (!isDragging) return;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  currentX = clientX - startX; currentY = clientY - startY;
  wrapper.style.transform = `scale(1.3) translate(${currentX}px, ${currentY}px)`;
}
function endDrag() {
  if (!isDragging) return;
  isDragging = false; wrapper.classList.remove('dragging');
  currentX = 0; currentY = 0; wrapper.style.transform = 'scale(1.3) translate(0px, 0px)'; 
  initAudio(); sfx.pet(); say('哎呀，差点飞走了！');
}

cloud.addEventListener('dblclick', () => {
  if (cloud.classList.contains('sleeping')) return;
  cloud.classList.add('flip'); sfx.magic();
  setTimeout(() => cloud.classList.remove('flip'), 800);
});

function pet(){
  initAudio(); sfx.pet(); s.mood = Math.min(100, s.mood + 6); s.love += 1; triggerBounce();
  if (cloud.classList.contains('sleeping')) {
    s.energy = Math.min(100, s.energy + 2); popHearts(1, '💤'); render(); save();
    say(pick(localLines.sleepTalk)); return; 
  }
  popHearts(1, '💗'); triggerShy(); render(); save(); say(pick(localLines.pet));
}

function feed(){
  initAudio(); sfx.feed();
  if(s.energy >= 95){ say('我还不饿呢～'); return; }
  s.energy = Math.min(100, s.energy + 15); s.mood = Math.min(100, s.mood + 3);
  popHearts(3, '✨'); triggerBounce(); render(); save();
  if (cloud.classList.contains('sleeping')) { say('唔……我在睡觉，不吃啦～'); return; }
  say(pick(localLines.feed));
}

function startBreath() {
  initAudio(); document.getElementById('breath-overlay').classList.add('show');

/* ============ 对话框逻辑 ============ */
function talk(){ initAudio(); document.getElementById('talk-modal').classList.add('show'); setTimeout(() => document.getElementById('talk-input').focus(), 100); }
function closeTalkModal() { document.getElementById('talk-modal').classList.remove('show'); document.getElementById('talk-input').value = ''; }

function submitTalk() {
  const msg = document.getElementById('talk-input').value.trim();
  if (!msg) return;
  closeTalkModal(); say('……', 800);

  setTimeout(() => {
    let reply = "";
    if (msg.includes('你是谁') || msg.includes('叫什么')) { reply = `我是${customName}呀！`; sfx.talk(); }
    else if (msg.includes('可爱') || msg.includes('好棒') || msg.includes('喜欢你')) { reply = pick(localLines.praise); sfx.talk(); }
    else if (msg.includes('雨') || msg.includes('变天')) { setWeather('rainy'); reply = pick(localLines.weatherRain); sfx.talk(); }
    else if (msg.includes('晴') || msg.includes('出太阳') || msg.includes('雨停')) { setWeather('sunny'); reply = pick(localLines.weatherSunny); sfx.talk(); }
    else if (msg.includes('早安') || msg.includes('早上好') || msg.includes('早')) {
      isManualSleep = false; setWeather('sunny'); s.energy = Math.max(60, s.energy); cloud.classList.remove('sleeping'); cloud.classList.add('awake'); 
      setTimeout(() => cloud.classList.remove('awake'), 600); 
      reply = pick(localLines.morning); sfx.feed(); triggerBounce();
    } else if (msg.includes('晚安') || msg.includes('睡了') || msg.includes('睡觉') || msg.includes('困了')) {
      isManualSleep = true; setWeather('night'); cloud.classList.add('sleeping'); reply = pick(localLines.night); sfx.pet();
    } 
    else if (Math.random() < 0.1) { reply = pick(localLines.hidden); sfx.magic(); popHearts(5, '🌈'); }
    else if (msg.includes('累') || msg.includes('烦') || msg.includes('难过')) { reply = pick(localLines.comfort); sfx.talk(); }
    else if (msg.includes('爱') || msg.includes('想你')) { reply = pick(localLines.love); sfx.talk(); }
    else if (msg.includes('你好') || msg.includes('嗨') || msg.includes('在吗')) { reply = pick(localLines.hi); sfx.talk(); }
    else { reply = pick(localLines.normal); sfx.talk(); }
    say(reply, 4000); s.love += 1; s.mood = Math.min(100, s.mood + 2); render(); save();
  }, 600);
}

document.getElementById('talk-input').addEventListener('keypress', function(e) { if (e.key === 'Enter') submitTalk(); });
