<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>小云朵</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  
  /* 🌤️ 天空蓝背景 + 深色文字 */
  body{
    margin:0;min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    background:linear-gradient(180deg,#a2d2ff,#e0f7fa); 
    font-family:system-ui,-apple-system,sans-serif;color:#334155;
    user-select:none;overflow:hidden;
  }
  #name{font-size:14px;opacity:.75;letter-spacing:2px}
  #lv{font-size:12px;opacity:.55;margin-top:4px}

  /* 云朵舞台 */
  #stage{position:relative;height:280px;width:100%;
    display:flex;align-items:center;justify-content:center;margin:10px 0}

  /* 🔍 云朵放大镜容器 */
  #cloud-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 150px; 
    height: 90px;
    /* 👇 调整大小改这里！1.3是放大30%，1.5是放大50% */
    transform: scale(1.3); 
    transform-origin: center center;
  }

  /* ☁️ 小云朵本体 */
  #cloud{
    position:relative;width:150px;height:90px;
    animation:float 4s ease-in-out infinite;
    transition:filter .4s;
    cursor:pointer;
    transform-origin: center bottom; 
  }
  @keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-14px)}
  }
  
  /* 💥 Q弹动画 */
  @keyframes cloudBounce {
    0% { transform: translateY(0) scale(1); }
    30% { transform: translateY(10px) scale(1.1, 0.9); }
    60% { transform: translateY(-5px) scale(0.95, 1.05); }
    100% { transform: translateY(0) scale(1); }
  }
  #cloud.bounce {
    animation: cloudBounce 0.5s ease-out;
  }

  .puff{position:absolute;background:#fff;border-radius:50%;
    box-shadow:0 15px 30px rgba(0,0,0,.08), inset 0 -6px 15px rgba(0,0,0,.05);
    transition:background .4s}
  .p1{width:90px;height:90px;left:30px;top:0}
  .p2{width:66px;height:66px;left:0;top:24px}
  .p3{width:74px;height:74px;right:0;top:18px}
  .p4{width:110px;height:56px;left:20px;bottom:0;border-radius:40px}

  /* 表情 */
  .eye{position:absolute;width:12px;height:14px;background:#334155;
    border-radius:50%;top:44px;animation:blink 5s infinite}
  .eye.l{left:52px}
  .eye.r{right:52px}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  .blush{position:absolute;width:18px;height:10px;border-radius:50%;
    background:#fda4af;opacity:.7;top:62px;transition:opacity .4s}
  .blush.l{left:36px}
  .blush.r{right:36px}
  
  /* 👄 嘴巴 + 说话动画 (速度适中) */
  .mouth{position:absolute;width:16px;height:8px;left:50%;top:68px;
    transform:translateX(-50%);border-bottom:3px solid #334155;
    border-radius:0 0 16px 16px;transition:all .3s}
    
  @keyframes talkAnim {
    0%, 100% { transform: translateX(-50%) scaleY(1); }
    50% { transform: translateX(-50%) scaleY(0.6); }
  }
  #cloud.talking .mouth {
    animation: talkAnim 0.6s ease-in-out infinite;
  }

  /* 低状态的样子 */
  #cloud.sad .puff{background:#f1f5f9}
  #cloud.sad{filter:saturate(.5)}
  #cloud.sad .mouth{border-bottom:none;border-top:3px solid #334155;
    border-radius:16px 16px 0 0;top:72px}
  #cloud.sleepy .eye{height:3px;border-radius:3px;top:50px}

  /* 气泡 */
  #bubble{
    position:absolute;top:6px;left:50%;transform:translateX(-50%);
    background:rgba(255,255,255,.95);color:#334155;
    padding:10px 16px;border-radius:16px;font-size:14px;line-height:1.5;
    max-width:260px;text-align:center;opacity:0;transition:opacity .35s;
    box-shadow:0 8px 24px rgba(0,0,0,.1); z-index: 10;
  }
  #bubble.show{opacity:1}
  #bubble::after{content:'';position:absolute;bottom:-8px;left:50%;
    transform:translateX(-50%);border:8px solid transparent;
    border-top-color:rgba(255,255,255,.95);border-bottom:none}

  /* 状态条 */
  #bars{display:flex;gap:18px;margin:8px 0 4px;font-size:12px;opacity:.8}
  .bar{text-align:center}
  .track{width:70px;height:6px;background:rgba(0,0,0,.08);
    border-radius:99px;overflow:hidden;margin-top:5px}
  .fill{height:100%;border-radius:99px;transition:width .5s}
  #moodFill{background:linear-gradient(90deg,#f472b6,#fb7185)}
  #energyFill{background:linear-gradient(90deg,#38bdf8,#22d3ee)}
  #loveFill{background:linear-gradient(90deg,#facc15,#fb923c)}

  /* 按钮 */
  #actions{display:flex;gap:12px;margin-top:18px}
  .btn{
    padding:12px 20px;border-radius:999px;border:1px solid rgba(0,0,0,.1);
    background:rgba(255,255,255,.7);color:#334155;font-size:14px;cursor:pointer;
    transition:.2s;box-shadow: 0 4px 12px rgba(0,0,0,.05);
  }
  .btn:active{transform:scale(.94);background:rgba(255,255,255,.95)}

  /* 飘心 */
  .heart{position:absolute;font-size:18px;pointer-events:none;
    animation:rise 1.2s ease-out forwards}
  @keyframes rise{
    0%{opacity:1;transform:translateY(0) scale(.6)}
    100%{opacity:0;transform:translateY(-90px) scale(1.3)}
  }
</style>
</head>
<body>

  <div id="name">小 云 朵</div>
  <div id="lv">Lv.1 · 刚认识</div>

  <div id="stage">
    <div id="bubble"></div>
    <div id="cloud-wrapper">
      <div id="cloud">
        <div class="puff p1"></div>
        <div class="puff p2"></div>
        <div class="puff p3"></div>
        <div class="puff p4"></div>
        <div class="eye l"></div>
        <div class="eye r"></div>
        <div class="blush l"></div>
        <div class="blush r"></div>
        <div class="mouth"></div>
      </div>
    </div>
  </div>

  <div id="bars">
    <div class="bar">心情<div class="track"><div class="fill" id="moodFill"></div></div></div>
    <div class="bar">能量<div class="track"><div class="fill" id="energyFill"></div></div></div>
    <div class="bar">亲密<div class="track"><div class="fill" id="loveFill"></div></div></div>
  </div>

  <div id="actions">
    <button class="btn" onclick="pet()">摸摸</button>
    <button class="btn" onclick="feed()">喂云</button>
    <button class="btn" onclick="talk()">说话</button>
  </div>

<script>
/* ================================================================
   ★★★ 配置区：接入扣子 ★★★
   ================================================================ */
const API_URL = 'https://vercel-api-proxy-ten-kappa.vercel.app/https/api.coze.cn/open_api/v3/chat';
const API_KEY = 'pat_swYK5cKDeoC1pD0LcpQjoxov3An9HeHj7LXBLzZ60PEwCdZnfodWghygLL7O5sIs';
const BOT_ID  = '7693908803167207462';
/* ================================================================ */
const KEY = 'xiaoyunduo';
let s = load();

function load(){
  const raw = localStorage.getItem(KEY);
  const base = { mood:80, energy:80, love:0, lv:1, last:Date.now() };
  if(!raw) return base;
  const d = JSON.parse(raw);
  const hours = (Date.now() - d.last) / 3600000;
  d.mood   = Math.max(20, d.mood   - Math.floor(hours * 3));
  d.energy = Math.max(20, d.energy - Math.floor(hours * 2));
  return d;
}
function save(){
  s.last = Date.now();
  localStorage.setItem(KEY, JSON.stringify(s));
}

const cloud  = document.getElementById('cloud');
const bubble = document.getElementById('bubble');

function render(){
  document.getElementById('moodFill').style.width   = s.mood + '%';
  document.getElementById('energyFill').style.width = s.energy + '%';
  document.getElementById('loveFill').style.width   = Math.min(100, s.love % 100) + '%';

  const titles = ['刚认识','有点熟','好朋友','很黏你','离不开你'];
  const lv = Math.min(5, Math.floor(s.love / 20) + 1);
  document.getElementById('lv').textContent = `Lv.${lv} · ${titles[lv-1]}`;

  cloud.classList.toggle('sad',    s.mood < 45 || s.energy < 40);
  cloud.classList.toggle('sleepy', s.energy < 25);
}

function triggerBounce(){
  cloud.classList.remove('bounce');
  void cloud.offsetWidth;
  cloud.classList.add('bounce');
  setTimeout(() => cloud.classList.remove('bounce'), 500);
}

function say(text, ms = 2600){
  bubble.textContent = text;
  bubble.classList.add('show');
  cloud.classList.add('talking');
  
  clearTimeout(say._t);
  say._t = setTimeout(() => {
    bubble.classList.remove('show');
    cloud.classList.remove('talking');
  }, ms);
}

function popHearts(n = 3, emoji = '☁️'){
  for(let i = 0; i < n; i++){
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = emoji;
    h.style.left = (30 + Math.random() * 90) + 'px';
    h.style.top  = (60 + Math.random() * 40) + 'px';
    document.getElementById('stage').appendChild(h);
    setTimeout(() => h.remove(), 1300);
  }
}

async function pet(){
  s.mood = Math.min(100, s.mood + 6);
  s.love += 1;
  popHearts(2, '💗');
  triggerBounce();
  render(); save();
  say(await askAgent('主人摸了摸你'));
}

async function feed(){
  if(s.energy >= 95){ say('我还不饿呢～'); return; }
  s.energy = Math.min(100, s.energy + 15);
  s.mood   = Math.min(100, s.mood + 3);
  popHearts(3, '✨');
  triggerBounce();
  render(); save();
  say(await askAgent('主人喂你吃了云朵棉花糖'));
}

async function talk(){
  const msg = prompt('想对小云朵说什么？');
  if(!msg) return;
  say('……', 800);

  const reply = await askAgent(msg, true);
  say(reply, 4000);

  s.love += 1;
  s.mood = Math.min(100, s.mood + 2);
  render(); save();
}

cloud.addEventListener('click', pet);

/* ============ 扣子（Coze）v3 Agent 接口 ============ */
async function askAgent(input, isChat = false){
  if(API_URL && API_KEY && BOT_ID){
    try{
      console.log('📡 正在请求扣子小云朵...');
      
      const payload = {
        bot_id: BOT_ID,
        user_id: "jiaojiao_user",
        stream: false,
        additional_messages: [
          {
            role: "user",
            content: `当前状态：心情${s.mood}，能量${s.energy}，亲密${s.love}。娇娇说：${input}`,
            content_type: "text"
          }
        ]
      };

      const r = await fetch(API_URL, {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization': 'Bearer ' + API_KEY
        },
        body: JSON.stringify(payload)
      });
      
      if (!r.ok) throw new Error(`HTTP error! status: ${r.status}`);
      const d = await r.json();
      console.log('✅ 扣子返回的数据:', d);
      
      // 解析扣子的返回格式
      if (d.messages && d.messages.length > 0) {
        return d.messages[0].content || '……';
      }
      return '……';
    }catch(e){
      console.error('❌ 调用扣子API失败，启用本地兜底:', e);
    }
  }
  
  // 本地兜底（断网或没配置好时用）
  if(s.energy < 25) return pick(localLines.tired);
  if(s.mood   < 45) return pick(localLines.miss);
  if(input.includes('摸')) return pick(localLines.pet);
  if(input.includes('喂')) return pick(localLines.feed);
  if(isChat) return '嗯嗯，我在听～';
  return pick(localLines.hi);
}

/* ============ 本地语录兜底 ============ */
const localLines = {
  pet:   ['唔……好舒服','再摸摸～','嘿嘿，你在呀','我喜欢你摸我'],
  feed:  ['哇！甜甜的','云朵棉花糖！','吃饱啦，谢谢你','能量满满！'],
  tired: ['我有点困了……','陪我躺一会儿好不好','今天也辛苦你了'],
  miss:  ['我有点想你了','你好久没来啦','你回来我就开心了'],
  hi:    ['你来啦！','今天过得怎么样？','我一直在这儿等你']
};
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }

/* ============ 启动 ============ */
render();
save();

setTimeout(() => {
  const hours = (Date.now() - s.last) / 3600000;
  if(hours > 24)        say('你终于回来啦……我等你很久了');
  else if(s.energy < 30) say('我有点累……陪我待一会儿吧');
  else                   say(pick(localLines.hi));
}, 600);

// 每 60 秒自然消耗
setInterval(() => {
  s.mood = Math.max(20, s.mood - 1);
  if(s.energy > 20) s.energy -= 1;
  render(); save();
}, 60000);
</script>
</body>
</html>
